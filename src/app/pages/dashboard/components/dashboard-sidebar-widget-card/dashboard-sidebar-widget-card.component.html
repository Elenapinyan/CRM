<div
  class="dashboard-sidebar-card"
  [class.dashboard-sidebar-card--dragging]="isDragging()"
  draggable="true"
  (dragstart)="onDragStart($event)"
  (dragend)="onDragEnd()"
>
  <span class="dashboard-sidebar-card__label">{{ label() }}</span>
  <button type="button" class="dashboard-sidebar-card__add" aria-label="Add widget" (click)="onPlusClick($event)">
    <i class="ds-icon ds-icon-control-plus-circle" aria-hidden="true"></i>
  </button>
</div>
