<div class="segment-filter-chip-menu" role="listbox">
  @if (withSearch()) {
    <div class="segment-filter-chip-menu__search-wrap">
      <input
        type="search"
        class="segment-filter-chip-menu__search"
        placeholder="Search"
        aria-label="Search options"
        [value]="searchQuery()"
        (input)="onSearchInput($any($event.target).value)"
        (click)="$event.stopPropagation()"
      />
    </div>
  }
  @for (option of filteredOptions(); track option.value) {
    <button
      type="button"
      class="segment-filter-chip-menu__item"
      [class.segment-filter-chip-menu__item--selected]="isSelected(option)"
      role="option"
      [attr.aria-selected]="isSelected(option)"
      (click)="onPick(option, $event)"
    >
      {{ option.label }}
    </button>
  } @empty {
    <div class="segment-filter-chip-menu__empty">No matches</div>
  }
</div>
