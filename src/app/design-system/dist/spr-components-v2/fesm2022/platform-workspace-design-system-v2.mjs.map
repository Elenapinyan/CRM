<input
  class="control-action__input control-action__input--switcher"
  type="checkbox"
  [formControl]="control"
  (blur)="cvaOnTouched()"
  [dsControlSize]="controlSize"
  dsLabelContainer
  dsLabelDefaultClass="control-action__label"
  [dsLabelPosition]="isLabelReverse ? 'start' : 'end'"
  ngDefaultControl
  [attr.name]="inputId()"
  [attr.id]="inputId()" />
