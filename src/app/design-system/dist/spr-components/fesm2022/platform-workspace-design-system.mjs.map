<a
  [routerLink]="item.routerLink"
  [class.active-sub]="item.activeSub"
  class="sidebar__link"
  routerLinkActive="active"
  (click)="toggleSubMenu(item)">
  <i
    *ngIf="item?.iconName"
    class="sidebar__item--icon"
    [ngClass]="[item.iconName]"></i>
  <span>{{ item.label }}</span>
  <i
    *ngIf="!!item.subNavs?.length"
    class="sidebar__item--icon btn-icon bo-icon-arrows-chevron-down"></i>
</a>
<ul
  *ngIf="!!item.subNavs?.length"
  [class.active-sub]="item.activeSub"
  class="sidebar__sub-nav">
  <li *ngFor="let subNav of item.subNavs">
    <spr-sidebar-item [item]="subNav"></spr-sidebar-item>
  </li>
</ul>
