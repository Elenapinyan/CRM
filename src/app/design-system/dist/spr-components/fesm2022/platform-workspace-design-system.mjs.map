<aside class="sidebar">
  <div class="sidebar__container">
    <h2 class="sidebar__title">{{ title }}</h2>
    <ul class="sidebar__nav">
      <li
        class="sidebar__list-item"
        *ngFor="let item of items">
        <spr-sidebar-item
          class="sidebar__item"
          [item]="item"
          (click)="closeOtherSubMenus(item)"></spr-sidebar-item>
      </li>
    </ul>
  </div>
</aside>
