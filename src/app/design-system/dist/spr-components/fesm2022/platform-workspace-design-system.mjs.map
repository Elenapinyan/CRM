<div
  class="inner-header"
  [ngClass]="[variant !== 'default' ? 'inner-header--' + variant : '', withoutBorder ? 'inner-header--no-border' : '']">
  <div [class.inner-header__title-container]="withStartContent">
    <h3
      *ngIf="title"
      class="inner-header__title">
      {{ title }}
    </h3>

    <ng-content select="[start]"></ng-content>
  </div>

  <ng-content select="[end]"></ng-content>
</div>
