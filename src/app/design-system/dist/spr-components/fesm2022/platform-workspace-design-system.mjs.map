<spr-base-modal-content>
  <ng-container header>
    <h4
      class="modal-header__title"
      id="modal-header__title">
      {{ modalData.title }}
    </h4>
    <button
      type="button"
      class="close-modal-button"
      aria-describedby="modal-header__title"
      (click)="closeAction()">
      <i class="bo-icon bo-icon-control-cross"></i>
    </button>
  </ng-container>

  <ng-container body>
    <p class="confirmation-message">
      <strong [innerHTML]="modalData.bodyMessage"></strong>
    </p>
  </ng-container>
  <ng-container footer>
    <spr-button
      variant="outline"
      size="sm"
      (click)="closeAction(false)">
      {{ modalData.cancelButtonText }}
    </spr-button>

    <spr-button
      variant="accent"
      size="sm"
      (click)="closeAction(true)">
      {{ modalData.confirmButtonText }}
    </spr-button>
  </ng-container>
</spr-base-modal-content>
