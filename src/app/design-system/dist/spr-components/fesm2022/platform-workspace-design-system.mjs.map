<div
  class="label-form-row"
  [class.label-form-row--reverse]="isLabelReverse"
  [ngClass]="className">
  <label
    [attr.for]="inputId"
    class="label-container"
    (click)="onLabelClick($event)">
    <i
      *ngIf="leftIcon"
      [class]="leftIcon"></i>

    <span
      *ngIf="label"
      class="label-form">
      {{ label }}
    </span>

    <i
      *ngIf="rightIcon"
      [class]="rightIcon"></i>
  </label>

  <small
    *ngIf="tooltip"
    [ngbTooltip]="tooltip"
    class="tooltip-container"
    container="body"
    [placement]="['auto']"
    tooltipClass="tooltip-container__body tooltip-white">
    <i class="bo-icon-general-info info-icon"></i>
  </small>
</div>
