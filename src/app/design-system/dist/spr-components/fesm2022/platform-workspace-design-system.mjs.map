<div class="transfer-list">
  <spr-inner-header [title]="visibleHeader + ' ' + sourceList.length + ' ' + countriesHeader"> </spr-inner-header>

  <div class="transfer-list__controls">
    <div class="transfer-list__sources">
      <div class="transfer-list__controls-title">{{ sourceColumnHeader }}</div>
      <ng-container
        [ngTemplateOutlet]="(customTemplates | getTemplate: 'sourceMoveAllButton') ?? defaultSourceMoveAllButton"
        [ngTemplateOutletContext]="{ move: moveToTarget.bind(this), moveAll: moveAllToTarget.bind(this) }" />

      <ng-template #defaultSourceMoveAllButton>
        <spr-button
          variant="form-button"
          size="sm"
          (click)="moveAllToTarget()">
          <i class="transfer-list-icon-md bo-icon-arrows-chevron-double-right"></i>
        </spr-button>
      </ng-template>
    </div>

    <div class="transfer-list__targets">
      <ng-container
        [ngTemplateOutlet]="(customTemplates | getTemplate: 'targetMoveAllButton') ?? defaultTargetMoveAllButton"
        [ngTemplateOutletContext]="{ move: moveToTarget.bind(this), moveAll: moveAllToSource.bind(this) }" />

      <ng-template #defaultTargetMoveAllButton>
        <spr-button
          variant="form-button"
          size="sm"
          (click)="moveAllToSource()">
          <i class="transfer-list-icon-md bo-icon-arrows-chevron-double-left"></i>
        </spr-button>
      </ng-template>
      <div class="transfer-list__controls-title">{{ targetColumnHeader }}</div>
    </div>
  </div>

  <div class="transfer-list__search-container">
    <spr-input
      controlSize="lg"
      [placeholder]="searchPlaceholder"
      [prepend]="true"
      [formControl]="searchControl">
      <i
        prependContent
        class="transfer-list-icon-sm bo-icon-control-search"></i>
    </spr-input>
  </div>
  <div class="transfer-list__data">
    <div class="transfer-list__data-source">
      <ng-container *ngFor="let item of sourceList | filteredList: searchControl.value; let i = index; trackBy: trackByName">
        <ng-container
          [ngTemplateOutlet]="(customTemplates | getTemplate: 'sourceItem') ?? defaultSourceItem"
          [ngTemplateOutletContext]="{ $implicit: item, move: moveToTarget.bind(this) }" />
      </ng-container>

      <ng-template
        #defaultSourceItem
        let-item
        let-move="move">
        <div class="transfer-list__data-source-item">
          <div class="inline-container">
            <ng-container
              [ngTemplateOutlet]="(customTemplates | getTemplate: 'sourceItemContent') ?? defaultSourceContent"
              [ngTemplateOutletContext]="{ $implicit: item, move: moveToTarget.bind(this) }" />

            <ng-template #defaultSourceContent>
              <i
                class="transfer-list-icon-sm"
                [ngClass]="item.icon"></i>
              {{ item.name }}
            </ng-template>
          </div>

          <spr-button
            variant="form-button"
            size="sm"
            [isIcon]="true"
            (click)="move(item)">
            <ng-container
              [ngTemplateOutlet]="(customTemplates | getTemplate: 'sourceItemButtonIcon') ?? defaultSourceButtonIcon"
              [ngTemplateOutletContext]="{ $implicit: item, move: moveToTarget.bind(this) }" />

            <ng-template #defaultSourceButtonIcon>
              <i class="transfer-list-icon-md bo-icon-arrows-chevron-right"></i>
            </ng-template>
          </spr-button>
        </div>
      </ng-template>
    </div>

    <div class="transfer-list__data-target">
      <ng-container *ngFor="let item of targetList | filteredList: searchControl.value; let i = index; trackBy: trackByName">
        <ng-container
          [ngTemplateOutlet]="(customTemplates | getTemplate: 'targetItem') ?? defaultTargetItem"
          [ngTemplateOutletContext]="{ $implicit: item, move: moveToSource.bind(this) }" />
      </ng-container>

      <ng-template
        #defaultTargetItem
        let-item
        let-move="move">
        <div class="transfer-list__data-target-item">
          <spr-button
            size="sm"
            variant="form-button"
            [isIcon]="true"
            (click)="move(item)">
            <ng-container
              [ngTemplateOutlet]="(customTemplates | getTemplate: 'targetItemButtonIcon') ?? defaultTargetButtonIcon"
              [ngTemplateOutletContext]="{ $implicit: item, move: moveToTarget.bind(this) }" />

            <ng-template #defaultTargetButtonIcon>
              <i class="transfer-list-icon-md bo-icon-arrows-chevron-left"></i>
            </ng-template>
          </spr-button>

          <div class="inline-container">
            <ng-container
              [ngTemplateOutlet]="(customTemplates | getTemplate: 'targetItemContent') ?? defaultTargetContent"
              [ngTemplateOutletContext]="{ $implicit: item, move: moveToTarget.bind(this) }" />

            <ng-template #defaultTargetContent>
              {{ item.name }}
              <i
                class="transfer-list-icon-sm"
                [ngClass]="item.icon"></i>
            </ng-template>
          </div>
        </div>
      </ng-template>
    </div>
  </div>
</div>
