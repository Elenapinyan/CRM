<spr-inner-header
  *ngIf="title"
  [title]="title"
  [withoutBorder]="true"
  [variant]="'large'">
</spr-inner-header>

<div class="brd-table-flex-container">
  <ng-container
    *ngIf="withPagination"
    [ngTemplateOutlet]="paginationTemplate"
    [ngTemplateOutletContext]="{ withSearch }"></ng-container>

  <section class="brd-table-container">
    <table
      class="brd-table"
      [ngClass]="['brd-table--' + cellSize, isHovering ? 'brd-table--with-hover' : '']">
      <thead>
        <tr class="brd-table__tr">
          <ng-container *ngFor="let column of displayedColumns">
            <ng-container
              *ngIf="column.columnKey | getHeaderTemplate: headerTemplates as headerTemplate; else defaultHeaderTemplate"
              [ngTemplateOutletContext]="{ $implicit: column }"
              [ngTemplateOutlet]="headerTemplate"></ng-container>

            <ng-template
              #defaultHeaderTemplate
              [sprTableHeader]="displayedRows[0]"
              [columnKey]="column.columnKey">
              <th sprTableHeaderCell>
                {{ column.text }}
              </th>
            </ng-template>
          </ng-container>
        </tr>
      </thead>

      <tbody>
        <tr
          *ngFor="let row of displayedRows; let rowIndex = index"
          class="brd-table__tr"
          (click)="rowClicked.emit(row)">
          <ng-container *ngFor="let column of displayedColumns">
            <ng-container
              *ngIf="column.columnKey | getRowTemplate: rowTemplates as rowTemplate; else defaultRowTemplate"
              [ngTemplateOutletContext]="{ $implicit: row, rowIndex }"
              [ngTemplateOutlet]="rowTemplate"></ng-container>

            <ng-template
              #defaultRowTemplate
              [sprTableRow]="displayedRows[0]"
              [columnKey]="column.columnKey">
              <td sprTableDataCell>
                {{ row[column.columnKey] }}
              </td>
            </ng-template>
          </ng-container>
        </tr>
      </tbody>
    </table>
  </section>

  <ng-container
    *ngIf="withPagination"
    [ngTemplateOutlet]="paginationTemplate"
    [ngTemplateOutletContext]="{ withSearch: false }"></ng-container>
</div>

<spr-spinner *ngIf="isLoading"></spr-spinner>

<ng-template
  #paginationTemplate
  let-withSearch="withSearch">
  <spr-pagination-bar
    [withExportSection]="withExportSection"
    [withBoundaryLinks]="withBoundaryLinks"
    [paginationParams]="paginationParams"
    [isPaginationInputDisabled]="isPaginationInputDisabled"
    [paginationWithPageSize]="paginationWithPageSize"
    [withSearch]="withSearch"
    [searchPlaceholder]="searchPlaceholder"
    [searchMaxLength]="searchMaxLength"
    [collectionSize]="collectionSize"
    [isLoading]="isLoading"
    [page]="page"
    [size]="size"
    [maxPages]="maxPages"
    (updatePageSize)="onUpdatePageSize($event)"
    (exportFormat)="exportAsFormat($event)"
    (searchValue)="onSearch($event)">
  </spr-pagination-bar>
</ng-template>
