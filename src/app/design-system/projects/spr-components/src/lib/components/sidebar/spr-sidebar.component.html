<aside class="sidebar">
  <div class="sidebar__container">
    <h2 class="sidebar__title">{{ title() }}</h2>
    <ul class="sidebar__nav">
      @for (item of items(); track item.label) {
        <li class="sidebar__list-item">
          <spr-sidebar-item
            class="sidebar__item"
            [item]="item"
            [isOpen]="expandedLabel() === item.label"
            (toggled)="toggleItem(item)" />
        </li>
      }
    </ul>
  </div>
</aside>
