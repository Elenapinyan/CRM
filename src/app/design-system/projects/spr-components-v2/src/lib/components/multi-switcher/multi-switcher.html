<div
  [id]="switcherId()"
  data-testid="multi-switcher-list"
  class="multi-switcher">
  @for (option of options(); track option.value) {
    <button
      [tabIndex]="currentSelectedValue() === option.value ? -1 : 0"
      [class.multi-switcher__item--selected]="currentSelectedValue() === option.value"
      [class.multi-switcher__item--disabled]="isDisabled()"
      [class.multi-switcher__item--icon]="option.icon"
      [class]="'multi-switcher__item--' + size()"
      class="multi-switcher__item"
      data-testid="switcher-option"
      (click)="onSwitcherChange(option.value)">
      @if (option.icon; as icon) {
        <i
          data-testid="switcher-option-icon"
          [class]="icon"></i>
      } @else if (option.text) {
        {{ option.text }}
      }
    </button>
  }
</div>
